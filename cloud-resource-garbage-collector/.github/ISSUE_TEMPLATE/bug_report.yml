name: Bug report
description: Report a reproducible defect
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes: { label: Description, description: What happened? }
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes: { label: Reproduction, description: Include sanitized steps and logs. }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Version }
    validations: { required: true }

